<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF5FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#150E22" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Open Gym · 24 semanas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23FFCC66'/%3E%3Cstop offset='.55' stop-color='%23F06BA8'/%3E%3Cstop offset='1' stop-color='%239B7BEA'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3Crect x='6' y='38' width='52' height='4' fill='%23FBF5FA'/%3E%3Crect x='6' y='46' width='52' height='3' fill='%23FBF5FA'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Shrikhand&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F1F8; --bg2:#F1E8F3; --surface:#FFFFFF; --surface-2:#F2EAF4; --ink:#241732; --muted:#8B7C9C; --line:#E8DDEC; --sep:rgba(60,40,80,.12);
  --violet:#9B7BEA; --pink:#F06BA8; --blue:#5CC3EE; --peach:#FFA37F; --sun:#FFCC66; --mint:#3FC49C;
  --on-accent:#FFFFFF; --on-grad:#2A1B3D; --fig:#241732; --fig2:#C9B6DC;
  --d1:var(--violet); --d2:var(--pink); --d3:var(--blue);
  --grad:linear-gradient(120deg,var(--sun),var(--peach) 45%,var(--pink));
  --grad-soft:linear-gradient(135deg,color-mix(in srgb,var(--sun) 32%,var(--surface)),color-mix(in srgb,var(--pink) 24%,var(--surface)) 60%,color-mix(in srgb,var(--violet) 28%,var(--surface)));
  --glass:color-mix(in srgb,var(--surface) 72%,transparent);
  --shadow:0 1px 1px rgba(36,23,50,.04),0 6px 22px rgba(36,23,50,.07);
  --r:22px; --r-sm:14px;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Nunito", system-ui, "Segoe UI", sans-serif;
  --round:ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, system-ui, sans-serif;
  --display:"Shrikhand", "Cooper Black", Georgia, serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --topH:54px; --tabH:68px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-ui="light"]){
    --bg:#120C1D; --bg2:#181026; --surface:#1E1530; --surface-2:#2A1F3E; --ink:#F7EEFF; --muted:#A898BC; --line:#33264A; --sep:rgba(255,255,255,.1);
    --violet:#B39BFF; --pink:#FF86BC; --blue:#7DD6FF; --peach:#FFB494; --sun:#FFD884; --mint:#6BE0BE;
    --on-accent:#120C1D; --fig:#F7EEFF; --fig2:#5E4B7C; --glass:color-mix(in srgb,var(--surface) 70%,transparent);
    --shadow:0 1px 1px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.28); color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-ui="light"]),:root[data-ui="dark"]{
  --bg:#120C1D; --bg2:#181026; --surface:#1E1530; --surface-2:#2A1F3E; --ink:#F7EEFF; --muted:#A898BC; --line:#33264A; --sep:rgba(255,255,255,.1);
  --violet:#B39BFF; --pink:#FF86BC; --blue:#7DD6FF; --peach:#FFB494; --sun:#FFD884; --mint:#6BE0BE;
  --on-accent:#120C1D; --fig:#F7EEFF; --fig2:#5E4B7C; --glass:color-mix(in srgb,var(--surface) 70%,transparent);
  --shadow:0 1px 1px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.28); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;-webkit-text-size-adjust:100%}
body{position:relative;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{margin:0;line-height:1.1}
h1{font-family:var(--round);font-weight:800;font-size:30px;letter-spacing:-.4px}
h2{font-family:var(--round);font-weight:800;font-size:20px;letter-spacing:-.2px}
h3{font-size:12.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.kicker{font-size:12.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--round);font-weight:800;font-variant-numeric:tabular-nums}

/* ===== Barras fijas de cristal ===== */
.top{position:absolute;left:0;right:0;top:0;height:var(--topH);z-index:10;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 .5px 0 var(--sep)}
.top-in{max-width:680px;height:100%;margin:0 auto;padding:0 14px;display:flex;align-items:center;gap:10px}
.brand{flex:1;display:flex;align-items:center;gap:9px;min-width:0}
.brand-sun{width:26px;height:26px;border-radius:50%;flex:none;background:linear-gradient(180deg,var(--sun),var(--pink) 60%,var(--violet));-webkit-mask:linear-gradient(#000 55%,transparent 55%),repeating-linear-gradient(180deg,#000 0 3px,transparent 3px 5.5px);mask:linear-gradient(#000 55%,transparent 55%),repeating-linear-gradient(180deg,#000 0 3px,transparent 3px 5.5px)}
.brand-t{font-family:var(--round);font-weight:800;font-size:19px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipbtn{position:relative;overflow:hidden;display:flex;align-items:center;gap:7px;background:var(--surface-2);border:0;border-radius:999px;padding:3px 12px 3px 3px;height:36px;font-weight:600;font-size:14px;transition:transform .25s var(--spring)}
.chipbtn:active{transform:scale(.92)}
.syncbtn{padding:0;width:36px;justify-content:center}
.syncbtn svg{width:18px;height:18px}
.syncbtn[data-state="ok"]{color:var(--mint)} .syncbtn[data-state="pending"]{color:var(--peach)} .syncbtn[data-state="error"]{color:var(--pink)}
.syncbtn[data-state="syncing"] svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
main#view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
main#view.noscroll{overflow:hidden}
.page{max-width:680px;margin:0 auto;padding:calc(var(--topH) + 14px) 16px calc(var(--tabH) + 34px);min-height:100%;display:flex;flex-direction:column;gap:12px}
.fade>.page,.fade>.tpage{animation:fadein .25s ease-out both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:10;padding:0 12px 8px;pointer-events:none}
.tabs-in{pointer-events:auto;position:relative;max-width:500px;height:var(--tabH);margin:0 auto;border-radius:34px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);box-shadow:0 0 0 .5px var(--sep),0 10px 30px rgba(36,23,50,.14);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:0 6px}
.tab{position:relative;overflow:hidden;background:none;border:0;border-radius:24px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);z-index:1;transition:color .25s}
.tab svg{width:24px;height:24px;transition:transform .35s var(--spring)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{transform:scale(1.08);color:var(--pink)}
.tab-ind{position:absolute;top:7px;height:54px;left:6px;width:calc((100% - 12px)/5);border-radius:24px;background:var(--grad-soft);transition:transform .45s var(--spring),opacity .25s;z-index:0}
.tab-clock{overflow:visible;height:var(--tabH)}
.clockbtn{position:relative;width:74px;height:74px;margin-top:-34px;border-radius:50%;display:grid;place-items:center;background:var(--grad);box-shadow:0 0 0 5px var(--bg),0 12px 26px color-mix(in srgb,var(--pink) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.7);transition:transform .3s var(--spring)}
.tab-clock:active .clockbtn{transform:scale(.9)}
.tab-clock[aria-current="page"] .clockbtn{box-shadow:0 0 0 5px var(--bg),0 0 0 8px color-mix(in srgb,var(--pink) 45%,transparent),0 12px 26px color-mix(in srgb,var(--pink) 45%,transparent)}
.clockbtn::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:3px solid var(--pink);opacity:0}
body.t-run .clockbtn::after{animation:ring 1.2s ease-out infinite}
@keyframes ring{0%{opacity:.8;transform:scale(.95)}100%{opacity:0;transform:scale(1.35)}}
.tab-clock .sw,.tab-clock[aria-current="page"] .sw{width:58px;height:58px;overflow:visible;margin-top:-2px;transform:none}
.sw .body{fill:#FFFDF8;stroke:#2A1B3D;stroke-width:3}
.sw .crown,.sw .stem,.sw .side{fill:#2A1B3D}
.sw .crown{transition:transform .2s var(--spring);transform-origin:32px 6px}
.tab-clock:active .sw .crown{transform:translateY(2.5px)}
.sw .tk{stroke:#2A1B3D;stroke-width:1.6;stroke-linecap:round;opacity:.55}
.sw .arc{fill:none;stroke:var(--pink);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:4 120;transform-origin:32px 36px;animation:arcspin 8s linear infinite}
.sw .hand{stroke:#F06BA8;stroke-width:2.6;stroke-linecap:round;transform-origin:32px 36px;animation:handspin 10s steps(60) infinite}
.sw .hub{fill:#2A1B3D}
body.t-run .sw .hand{animation-duration:1s;animation-timing-function:linear}
body.t-run .sw .arc{animation-duration:1.2s}
@keyframes handspin{to{transform:rotate(360deg)}}
@keyframes arcspin{to{transform:rotate(360deg)}}
.clocklbl{position:absolute;bottom:3px;font-size:10.5px;font-weight:600;color:var(--muted)}
.tab-clock[aria-current="page"] .clocklbl{color:var(--ink)}

/* ===== Controles ===== */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-sm);border:0;background:var(--surface-2);height:50px;padding:0 18px;font-weight:700;font-size:16px;transition:transform .25s var(--spring),opacity .2s}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--grad);color:var(--on-grad);box-shadow:0 8px 20px color-mix(in srgb,var(--pink) 28%,transparent)}
.btn-tint{background:color-mix(in srgb,var(--violet) 16%,var(--surface));color:var(--violet)}
.btn-cool{background:linear-gradient(120deg,var(--blue),var(--violet));color:#fff}
.btn-line{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.btn-danger{background:color-mix(in srgb,var(--pink) 12%,var(--surface));color:var(--pink)}
.btn-block{width:100%}
.btn-sm{height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn svg{width:20px;height:20px;flex:none}
.btn:disabled{opacity:.4;pointer-events:none}
.iconbtn{position:relative;overflow:hidden;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:0;background:var(--surface-2);flex:none;transition:transform .25s var(--spring)}
.iconbtn:active{transform:scale(.88)}
.iconbtn svg{width:20px;height:20px}
.iconbtn:disabled{opacity:.35}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.16;transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
.seg{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:none;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:12px;padding:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;overflow:hidden;flex:1 0 auto;height:34px;padding:0 12px;border-radius:10px;border:0;background:transparent;font-weight:600;font-size:13.5px;color:var(--ink);transition:background .25s,box-shadow .25s,transform .2s var(--spring)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:700}
.seg button:active{transform:scale(.96)}
.group{background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--shadow);overflow:hidden}
.gitem{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;width:100%;border:0;background:transparent;text-align:left;font-size:16px}
.gitem+.gitem::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.gitem .lbl{flex:1;min-width:0}
.gitem .lbl small{display:block;font-size:12.5px;color:var(--muted)}
.gitem .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:16px;flex:none;background:var(--surface-2)}
.gtitle{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;padding:6px 16px 0;font-weight:600}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:999px;background:color-mix(in srgb,var(--ink) 16%,transparent);transition:background .25s}
.switch i::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .3s var(--spring)}
.switch input:checked+i{background:var(--mint)}
.switch input:checked+i::after{transform:translateX(20px)}
.switch input:focus-visible+i{outline:3px solid var(--violet);outline-offset:2px}

/* ===== Entrenar ===== */
.hoy-head{display:flex;align-items:center;gap:12px}
.hoy-head .t{flex:1;min-width:0}
.ringmini{position:relative;width:56px;height:56px;flex:none}
.ringmini svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringmini .v{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--round);font-weight:800;font-size:15px;text-align:center;line-height:1}
.ringmini .v small{display:block;font-size:9.5px;font-weight:700;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:none}
.pill{position:relative;overflow:hidden;border:0;border-radius:var(--r-sm);background:var(--surface);box-shadow:var(--shadow);height:52px;padding:0 10px;display:flex;align-items:center;gap:8px;text-align:left;transition:transform .25s var(--spring)}
.pill:active{transform:scale(.95)}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--dc);flex:none}
.pill b{display:block;font-size:14px;font-weight:700;line-height:1.1}
.pill span{display:block;font-size:11.5px;font-weight:600;color:var(--muted)}
.pill.on{background:color-mix(in srgb,var(--dc) 16%,var(--surface));box-shadow:inset 0 0 0 1.5px var(--dc)}
.pill.done span{color:var(--mint)}
.d1{--dc:var(--d1)} .d2{--dc:var(--d2)} .d3{--dc:var(--d3)}
.tip{position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;width:100%;border:0;text-align:left;background:color-mix(in srgb,var(--sun) 22%,var(--surface));border-radius:var(--r-sm);padding:10px 12px;font-weight:600;font-size:14px;flex:none}
.tip.ok{background:color-mix(in srgb,var(--mint) 18%,var(--surface))} .tip.red{background:color-mix(in srgb,var(--pink) 16%,var(--surface))}
.tip i{font-style:normal}
.tip span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:14px;padding:3px;flex:none}
.stepbtn{position:relative;overflow:hidden;border:0;background:transparent;border-radius:11px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:600;color:var(--muted);transition:background .25s,color .25s,box-shadow .25s}
.stepbtn b{font-family:var(--round);font-weight:800;font-size:15px;line-height:1}
.stepbtn.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.stepbtn.on b{color:var(--dc)}
.stepbtn.ok b{color:var(--mint)}
.ficha{flex:1;min-height:300px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;touch-action:pan-y;position:relative}
.ficha::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--dc),color-mix(in srgb,var(--dc) 30%,var(--sun)))}
.ficha-body{flex:1;padding:20px 18px 10px;overflow-y:auto;overscroll-behavior:contain}
.ficha-foot{flex:none;display:flex;gap:10px;padding:10px 14px 14px}
.ficha-foot .btn{flex:1}
.slide-n .ficha-body{animation:sn .3s ease-out}
.slide-p .ficha-body{animation:sp .3s ease-out}
@keyframes sn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes sp{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.bigtxt{font-size:18px;font-weight:600;line-height:1.4}
.list{list-style:none;padding:0;margin:8px 0 0}
.list li{display:flex;gap:12px;padding:10px 0;font-weight:600;position:relative}
.list li+li::before{content:"";position:absolute;left:36px;right:0;top:0;height:.5px;background:var(--sep)}
.list li i{font-style:normal;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--dc,var(--violet)) 18%,var(--surface));font-size:12px;font-weight:800;flex:none}
.mtype{font-family:var(--round);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.3px}
.bench{display:inline-block;vertical-align:middle;margin-left:6px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--blue) 25%,var(--surface))}
.movechips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none;touch-action:pan-x}
.movechips::-webkit-scrollbar{display:none}
.movechip{position:relative;overflow:hidden;flex:none;display:flex;align-items:center;gap:7px;border:0;background:var(--surface-2);border-radius:999px;padding:3px 14px 3px 3px;font-weight:600;font-size:13.5px;height:42px;transition:transform .25s var(--spring)}
.movechip:active{transform:scale(.93)}
.movechip svg{width:36px;height:36px;border-radius:50%;background:var(--surface);flex:none}
.done-tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--mint)}

/* ===== Formularios ===== */
label.field{display:block}
label.field>span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=date],input[type=search],input[type=number],textarea,select{width:100%;height:48px;border:0;background:var(--surface-2);border-radius:12px;padding:10px 14px;font-size:17px;transition:box-shadow .2s;-webkit-appearance:none;appearance:none}
textarea{height:84px;resize:none}
input:focus,textarea:focus,select:focus{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--violet) 40%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{position:relative;overflow:hidden;display:inline-flex;align-items:center;height:38px;padding:0 14px;border-radius:999px;background:var(--surface-2);font-weight:600;font-size:14.5px;transition:background .2s,color .2s}
.chip input:checked+span{background:var(--ink);color:var(--bg)}
.chip input:focus-visible+span{outline:3px solid var(--violet);outline-offset:2px}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe label{position:relative}
.rpe input{position:absolute;opacity:0}
.rpe span{position:relative;overflow:hidden;display:grid;place-items:center;height:44px;border-radius:12px;background:var(--surface-2);font-family:var(--round);font-weight:800;font-size:16px;transition:transform .25s var(--spring),background .2s}
.rpe input:checked+span{background:var(--grad);color:var(--on-grad);transform:scale(1.06)}
.linkbtn{border:0;background:none;padding:6px 0;font-weight:600;color:var(--violet);font-size:15px}

/* ===== Plan ===== */
.weeknav{display:flex;align-items:center;gap:10px;background:var(--grad-soft);border-radius:var(--r);padding:14px 10px;touch-action:pan-y;flex:none}
.weeknav .t{flex:1;text-align:center;min-width:0}
.weeknav h1{font-size:32px}
.weeknav .iconbtn{background:color-mix(in srgb,var(--surface) 80%,transparent)}
.tagpill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface);margin-top:4px}
.wdots{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;flex:none}
.wdot{position:relative;overflow:hidden;border:0;height:24px;border-radius:6px;background:var(--surface-2);padding:0;transition:transform .2s var(--spring)}
.wdot i{position:absolute;left:0;right:0;bottom:0;background:var(--violet);border-radius:6px}
.wdot.full i{background:var(--grad)}
.wdot.on{box-shadow:0 0 0 2px var(--ink)}
.wdot:active{transform:scale(.85)}
.wdots-l{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--muted);margin-top:-6px;flex:none}
.daycards{display:grid;gap:10px;align-content:start}
.daycard{position:relative;overflow:hidden;border:0;text-align:left;background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:14px 16px 14px 20px;display:flex;align-items:center;gap:12px;transition:transform .25s var(--spring)}
.daycard:active{transform:scale(.97)}
.daycard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--dc)}
.daycard .t{flex:1;min-width:0}
.daycard b{display:block;font-weight:700;font-size:16px}
.daycard .m{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daycard .st{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.daycard.done .st{background:color-mix(in srgb,var(--mint) 22%,var(--surface))}
.daycard.next .st{background:var(--grad);color:var(--on-grad)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mcard{position:relative;overflow:hidden;border:0;background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:6px 6px 8px;text-align:center;transition:transform .25s var(--spring)}
.mcard:active{transform:scale(.94)}
.mcard svg{width:100%;height:auto;display:block;border-radius:10px;background:var(--surface-2)}
.mcard b{display:block;margin-top:5px;font-size:12px;font-weight:700;line-height:1.15}
details.acc{background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:0 16px}
details.acc>summary{list-style:none;cursor:pointer;height:54px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:16.5px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"";width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(-45deg);transition:transform .3s var(--spring)}
details.acc[open]>summary::after{transform:rotate(45deg)}
details.acc>div{padding-bottom:16px;font-size:15px}
details.acc p+p{margin-top:8px}
details.acc ul{margin:6px 0 0;padding-left:18px} details.acc li+li{margin-top:4px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:.5px solid var(--sep);vertical-align:top}
th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--mint);font-weight:700} .down{color:var(--pink);font-weight:700}

/* ===== Figura ===== */
.stage{position:relative;border-radius:var(--r);overflow:hidden;background:linear-gradient(180deg,var(--bg2),var(--surface-2))}
.stage::before{content:"";position:absolute;left:50%;top:12%;width:58%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:linear-gradient(180deg,var(--sun),var(--peach) 45%,var(--pink));opacity:.28;-webkit-mask:repeating-linear-gradient(180deg,#000 0 9px,transparent 9px 13px);mask:repeating-linear-gradient(180deg,#000 0 9px,transparent 9px 13px)}
.stage svg{position:relative;width:100%;height:auto;display:block;max-height:44vh}
.stage-ctl{position:absolute;right:10px;bottom:10px;display:flex;gap:8px}
.stage-ctl .iconbtn{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
svg .lf,svg .lt,svg .lb{stroke-linecap:round;fill:none}
svg .lf{stroke:var(--fig);stroke-width:7} svg .lt{stroke:var(--fig);stroke-width:10} svg .lb{stroke:var(--fig2);stroke-width:7}
svg .hd{fill:var(--fig)}
svg .prop{stroke:var(--muted);stroke-width:5;stroke-linecap:round;fill:none;opacity:.7}
svg .propf{fill:var(--surface);stroke:var(--line);stroke-width:2}
svg .floor{stroke:var(--line);stroke-width:3}
svg .fshadow{fill:var(--ink);opacity:.1}
svg .obj{fill:var(--pink)} svg .obj2{fill:var(--violet)}
svg .rope{stroke:var(--violet);stroke-width:2.5;fill:none}
.cues{list-style:none;padding:0;margin:0}
.cues li{display:flex;gap:12px;padding:9px 0;font-weight:600}
.cues li i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--grad);color:var(--on-grad);flex:none;font-size:12px;font-weight:800}
.cues.err li i{background:color-mix(in srgb,var(--pink) 20%,var(--surface));color:var(--pink)}

/* ===== Progreso / Informe ===== */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{position:relative;overflow:hidden;background:var(--surface);border-radius:var(--r-sm);padding:14px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--round);font-weight:800;font-size:28px;line-height:1.05}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat::after{content:"";position:absolute;right:-16px;top:-16px;width:56px;height:56px;border-radius:50%;background:var(--sc,var(--violet));opacity:.18}
.goal{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:end}
.goal+.goal{margin-top:13px}
.goal .name{font-weight:600;font-size:14.5px}
.goal .val{font-family:var(--round);font-weight:800;font-size:15px}
.bar{grid-column:1/-1;height:9px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:var(--w);background:var(--grad);border-radius:999px;animation:grow 1s var(--spring) both}
.bar.full i{background:linear-gradient(90deg,var(--mint),var(--blue))}
@keyframes grow{from{width:0}}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--font);font-size:10px;font-weight:600}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{text-align:center;padding:10px 2px 8px;border-radius:var(--r-sm);background:var(--surface);box-shadow:var(--shadow);opacity:.45}
.badge.on{opacity:1}
.badge .ico{width:44px;height:44px;margin:0 auto 5px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--surface-2)}
.badge.on .ico{background:var(--grad);animation:wob 3.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.badge b{display:block;font-size:11px;line-height:1.15;font-weight:700}
.prrow{position:relative;display:flex;align-items:center;gap:10px;padding:12px 0;width:100%;border:0;background:none;text-align:left}
.prrow+.prrow{border-top:.5px solid var(--sep)}
.prrow b{display:block;font-weight:700}
.prbest{font-family:var(--round);font-weight:800;font-size:19px;white-space:nowrap}
.prhist{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.prhist span{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2)}
.prpick{display:flex;flex-direction:column;max-height:34vh;overflow-y:auto;background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--shadow)}
.prpick button{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:0 14px;border:0;background:none;text-align:left;font-size:15.5px;position:relative}
.prpick button+button::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--sep)}
.prpick button small{color:var(--muted);font-size:12px}
.prpick button:active{background:var(--surface-2)}
.prpick .new{color:var(--violet);font-weight:700}
.pct{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pct div{background:var(--surface-2);border-radius:12px;padding:8px 4px;text-align:center}
.pct small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.pct b{font-family:var(--round);font-weight:800;font-size:15px}
.rep-h{background:var(--grad-soft);border-radius:var(--r);padding:18px}
.rep-h h1{font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:0}
.advice{display:flex;gap:12px;padding:12px 0}
.advice+.advice{border-top:.5px solid var(--sep)}
.advice .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:var(--surface-2);flex:none}
.advice b{display:block;font-weight:700}
.advice p{font-size:14.5px;color:var(--muted);margin-top:2px}
.note{border-radius:var(--r-sm);padding:12px 14px;background:color-mix(in srgb,var(--sun) 20%,var(--surface))}
.note.red{background:color-mix(in srgb,var(--pink) 14%,var(--surface))} .note.ok{background:color-mix(in srgb,var(--mint) 16%,var(--surface))}
.note b{display:block;font-weight:700;margin-bottom:2px}

/* ===== Nutrición ===== */
.bottle-card{display:flex;gap:16px;align-items:center}
.bottle{position:relative;width:96px;height:150px;flex:none}
.bottle svg{width:100%;height:100%;overflow:visible}
.bottle .glassb{fill:color-mix(in srgb,var(--blue) 10%,var(--surface));stroke:color-mix(in srgb,var(--blue) 60%,var(--ink));stroke-width:2.5}
.bottle .wave{animation:wave 2.6s linear infinite}
.bottle .wave2{animation:wave 3.8s linear infinite reverse;opacity:.55}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-80px)}}
.bottle .lvl{transition:transform 1s var(--spring)}
.bignum{font-family:var(--round);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.5px}
.qadd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qadd .btn{height:46px;font-size:15px}
.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.macro div{background:var(--surface-2);border-radius:14px;padding:10px 4px}
.macro b{display:block;font-family:var(--round);font-weight:800;font-size:20px}
.macro small{font-size:11.5px;color:var(--muted);font-weight:600}
.ringrow{display:flex;gap:16px;align-items:center}
.ringbig{position:relative;width:96px;height:96px;flex:none}
.ringbig svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbig .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05;font-family:var(--round);font-weight:800;font-size:19px}
.ringbig .v small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;font-family:var(--font)}

/* ===== Perfil ===== */
.plist{display:grid;gap:0}
.prof{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:10px 16px;border:0;background:transparent;width:100%;text-align:left;min-height:62px}
.prof+.prof::before{content:"";position:absolute;left:72px;right:0;top:0;height:.5px;background:var(--sep)}
.prof:active{background:var(--surface-2)}
.prof .avatar{width:42px;height:42px;font-size:17px}
.prof .meta{flex:1;min-width:0}
.prof .meta b{display:block;font-weight:700}
.prof .chk{color:var(--pink);font-weight:800}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.swatch{position:relative}
.swatch input{position:absolute;opacity:0}
.swatch span{display:block;width:38px;height:38px;border-radius:50%;transition:transform .25s var(--spring)}
.swatch input:checked+span{transform:scale(1.12);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.status{display:flex;align-items:center;gap:8px;font-weight:700}
.status .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.status .dot.ok{background:var(--mint);box-shadow:0 0 0 4px color-mix(in srgb,var(--mint) 25%,transparent)}
.status .dot.warn{background:var(--peach)} .status .dot.err{background:var(--pink)}
code{font-size:12.5px;background:var(--surface-2);padding:1px 6px;border-radius:6px;word-break:break-all}

/* ===== Reloj ===== */
.tpage{max-width:680px;height:100%;margin:0 auto;padding:calc(var(--topH) + 10px) 12px calc(var(--tabH) + 30px);display:flex;flex-direction:column;gap:10px}
.tm-origin{flex:none;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:5px 5px 5px 12px;box-shadow:var(--shadow);font-size:13.5px}
.tm-origin span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-origin .dot{width:9px;height:9px;border-radius:50%;background:var(--dc);flex:none}
.tm-stage{position:relative;flex:1;min-height:240px;border-radius:30px;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,#120A24 0%,#2B1350 38%,#6A2A7E 62%,#C2457F 82%,#FF9E7A 100%);box-shadow:0 14px 34px rgba(42,16,70,.28)}
.tm-stage.rest{background:linear-gradient(180deg,#071226 0%,#0E2E55 40%,#1F6A9C 70%,#5CC3EE 92%,#B8ECFF 100%)}
.stars{position:absolute;inset:0 0 40% 0;z-index:0}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.08}}
.sun{position:absolute;left:50%;bottom:24%;width:min(64%,330px);aspect-ratio:1;transform:translate(-50%,46%);border-radius:50%;z-index:0;background:linear-gradient(180deg,#FFF1B3 0%,#FFC66B 30%,#FF7FA8 62%,#B26BE8 100%);-webkit-mask:linear-gradient(#000 48%,transparent 48%),repeating-linear-gradient(180deg,#000 0 10px,transparent 10px 15px);mask:linear-gradient(#000 48%,transparent 48%),repeating-linear-gradient(180deg,#000 0 10px,transparent 10px 15px);-webkit-mask-size:100% 100%,100% 30px;mask-size:100% 100%,100% 30px;filter:drop-shadow(0 0 30px rgba(255,140,170,.55))}
.tm-stage.rest .sun{background:linear-gradient(180deg,#F4FCFF,#9BE3FF 45%,#7FA8FF 75%,#B39BFF)}
.tm-stage.running .sun{animation:sunslats 1.4s linear infinite}
@keyframes sunslats{to{-webkit-mask-position:0 0,0 30px;mask-position:0 0,0 30px}}
.mts{position:absolute;left:0;right:0;bottom:22%;width:100%;height:24%;z-index:1}
.mts .b{fill:#3A1A5E;opacity:.85} .mts .f{fill:#22103F} .mts .e{fill:none;stroke:#FF86BC;stroke-width:1.4;opacity:.8}
.tm-stage.rest .mts .b{fill:#123A63} .tm-stage.rest .mts .f{fill:#0A2244} .tm-stage.rest .mts .e{stroke:#7DD6FF}
.tfloor{position:absolute;left:0;right:0;bottom:0;height:22.5%;z-index:1;overflow:hidden;background:linear-gradient(180deg,#22103F,#3B1660);border-top:2px solid #FF86BC;box-shadow:0 -6px 24px rgba(255,134,188,.55)}
.tm-stage.rest .tfloor{background:linear-gradient(180deg,#0A2244,#123A63);border-top-color:#7DD6FF}
.tfloor::before{content:"";position:absolute;left:-60%;right:-60%;top:0;height:240%;background-image:linear-gradient(rgba(255,134,188,.55) 2px,transparent 2px),linear-gradient(90deg,rgba(255,134,188,.55) 2px,transparent 2px);background-size:46px 30px;transform:perspective(160px) rotateX(62deg);transform-origin:top}
.tm-stage.rest .tfloor::before{background-image:linear-gradient(rgba(125,214,255,.5) 2px,transparent 2px),linear-gradient(90deg,rgba(125,214,255,.5) 2px,transparent 2px)}
.tm-stage.running .tfloor::before{animation:gridmv .9s linear infinite}
@keyframes gridmv{to{background-position:0 30px,0 0}}
.tm-ring{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:2;width:260px;height:260px}
.tm-ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.tm-ring .glassr{fill:rgba(18,10,36,.38)}
.tm-ring .trk{stroke:rgba(255,255,255,.14)}
.tm-ring .prg{filter:drop-shadow(0 0 5px rgba(255,134,188,.9));transition:stroke-dashoffset .25s linear}
.tm-ring .prg2{stroke:rgba(255,255,255,.8);transition:stroke-dashoffset .2s linear}
.tm-ring .tick{stroke:rgba(255,255,255,.22);stroke-width:1.1;stroke-linecap:round;transition:stroke .25s}
.tm-ring .tick.on{stroke:#FFE08A}
.tm-ring .comet{fill:#FFF6D9;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 8px #FF86BC)}
.pulse{position:absolute;left:50%;top:44%;z-index:1;border-radius:50%;transform:translate(-50%,-50%) scale(.9);border:2px solid rgba(255,214,140,.7);opacity:0;pointer-events:none}
.pulse.go{animation:pulse .9s ease-out}
@keyframes pulse{0%{opacity:.8;transform:translate(-50%,-50%) scale(.92)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.22)}}
.tm-face{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none;color:#FFF6FB}
.tm-mname{font-family:var(--display);font-size:19px;color:#FFE08A;text-shadow:0 0 12px rgba(255,200,120,.6)}
.digits{display:flex;justify-content:center;font-family:var(--round);font-weight:800;font-size:68px;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.digits .dg{display:inline-block;min-width:.6em;text-align:center;background:linear-gradient(180deg,#FFFBEA 0%,#FFE08A 38%,#FF86BC 74%,#B39BFF 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(255,134,188,.6)) drop-shadow(0 3px 0 rgba(42,16,70,.9))}
.tm-stage.rest .digits .dg{background-image:linear-gradient(180deg,#FFFFFF 0%,#BDEEFF 45%,#7DD6FF 75%,#B39BFF 100%)}
.digits .dg.sep{min-width:.3em}
.digits .dg.in{animation:flip .38s var(--spring)}
@keyframes flip{from{transform:translateY(-30%) scale(.8);opacity:0}to{transform:none;opacity:1}}
.digits.lead .dg.in{animation:zoom .7s var(--spring)}
@keyframes zoom{from{transform:scale(2.2);opacity:0}to{transform:none;opacity:1}}
.tm-sub{font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px;background:rgba(18,10,36,.45);color:#FFF6FB;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tm-rounds{position:absolute;top:12px;right:12px;z-index:4;min-width:64px;padding:6px 12px 8px;border-radius:18px;background:rgba(18,10,36,.5);color:#fff;text-align:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tm-rounds small{display:block;font-size:10px;font-weight:700;letter-spacing:.8px;opacity:.8}
.tm-rounds b{font-family:var(--round);font-weight:800;font-size:28px;line-height:1;display:inline-block}
.tm-rounds b.pop{animation:npop .5s var(--spring)}
@keyframes npop{0%{transform:scale(1.8);color:#FFE08A}100%{transform:none}}
.tm-hint{position:absolute;left:0;right:0;bottom:4%;z-index:4;text-align:center;color:rgba(255,255,255,.85);font-weight:700;font-size:13px;animation:hint 2.2s ease-in-out infinite}
@keyframes hint{50%{opacity:.4}}
.flash{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 44%,rgba(255,224,138,.65),transparent 65%)}
.flash.go{animation:flash .7s ease-out}
.flash.cool{background:radial-gradient(circle at 50% 44%,rgba(125,214,255,.7),transparent 65%)}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.bigmsg{position:absolute;left:0;right:0;top:12%;z-index:6;text-align:center;font-family:var(--display);font-size:46px;color:#FFE08A;text-shadow:0 0 18px rgba(255,134,188,.9),0 4px 0 #2B1350;pointer-events:none;opacity:0}
.bigmsg.show{animation:msg 1.6s var(--spring) forwards}
@keyframes msg{0%{opacity:0;transform:scale(.4) rotate(-6deg)}25%{opacity:1;transform:scale(1.08) rotate(-3deg)}100%{opacity:1;transform:scale(1) rotate(-3deg)}}
.tm-stage.alert .tm-ring svg{animation:alertp .5s ease-in-out infinite alternate}
@keyframes alertp{to{filter:drop-shadow(0 0 18px rgba(255,134,188,.95))}}
.tm-cfg{flex:none;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.stepper .iconbtn{width:38px;height:38px;font-size:20px;font-weight:600}
.stepper b{font-family:var(--round);font-weight:800;font-size:17px;min-width:3.4ch;text-align:center;display:block}
.stepper small{display:block;font-size:9.5px;font-weight:700;color:var(--muted);text-align:center;margin-top:-1px}
.tm-ctl{flex:none;display:grid;grid-template-columns:50px 1fr 50px;gap:12px;align-items:center}
.tm-ctl .iconbtn{width:50px;height:50px;background:var(--surface);box-shadow:var(--shadow)}
.tm-ctl .iconbtn[aria-pressed="false"]{opacity:.5}
.bigplay{position:relative;overflow:hidden;height:58px;border:0;border-radius:29px;background:var(--grad);color:var(--on-grad);font-family:var(--round);font-weight:800;font-size:18px;box-shadow:0 10px 24px color-mix(in srgb,var(--pink) 35%,transparent);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .25s var(--spring)}
.bigplay svg{width:22px;height:22px}
.bigplay:active{transform:scale(.95)}
.bigplay.pause{background:linear-gradient(120deg,var(--blue),var(--violet));color:#fff}
.laps{flex:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.laps:empty{display:none}
.laps span{flex:none;font-family:var(--round);font-weight:700;font-size:12px;padding:5px 10px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow)}
body.focus .top,body.focus .tabs,body.focus .tm-hide{display:none !important}
body.focus .tpage{padding-top:12px;padding-bottom:12px}

/* ===== Hoja ===== */
.sheet{position:fixed;inset:0;z-index:50;visibility:hidden}
.sheet.open{visibility:visible}
.sheet .scrim{position:absolute;inset:0;background:rgba(18,12,29,.4);opacity:0;transition:opacity .3s}
.sheet.open .scrim{opacity:1}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:28px 28px 0 0;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:680px;margin:0 auto;transform:translateY(105%);transition:transform .45s var(--spring);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet.open .panel{transform:translateY(0)}
.sheet .panel.dragging{transition:none}
.grabzone{position:sticky;top:0;z-index:2;background:var(--bg);height:38px;touch-action:none;display:flex;align-items:center;justify-content:center}
.grab{width:38px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--ink) 22%,transparent)}
.sheet-x{position:absolute;right:0;top:4px;width:32px;height:32px}
.sheet-x svg{width:14px;height:14px}
#sheetBody{display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;top:calc(var(--topH) + 10px + env(safe-area-inset-top,0px));transform:translate(-50%,-16px);background:color-mix(in srgb,var(--ink) 92%,transparent);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;z-index:80;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--spring);text-align:center;font-size:14.5px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.badgepop{position:fixed;left:50%;top:32%;z-index:85;transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none;text-align:center;transition:transform .55s var(--spring),opacity .3s}
.badgepop.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.badgepop .ico{width:110px;height:110px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:52px;background:var(--grad);box-shadow:0 14px 40px color-mix(in srgb,var(--pink) 45%,transparent)}
.badgepop b{display:inline-block;margin-top:14px;font-weight:800;font-size:20px;background:var(--surface);padding:8px 16px;border-radius:999px;box-shadow:var(--shadow)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
.focus-x{position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top,0px));z-index:40;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.welcome{justify-content:center}
.welcome h1{font-family:var(--display);font-weight:400;font-size:44px;line-height:1}
.bigsun{width:110px;height:110px;border-radius:50%;background:linear-gradient(180deg,var(--sun),var(--peach) 40%,var(--pink) 70%,var(--violet));-webkit-mask:linear-gradient(#000 52%,transparent 52%),repeating-linear-gradient(180deg,#000 0 10px,transparent 10px 15px);mask:linear-gradient(#000 52%,transparent 52%),repeating-linear-gradient(180deg,#000 0 10px,transparent 10px 15px)}
.loading{display:grid;place-items:center;height:100%;font-weight:700;font-size:20px;color:var(--muted)}
@media (min-width:700px){.mgrid{grid-template-columns:repeat(4,1fr)}.stats{grid-template-columns:repeat(4,1fr)}.badges{grid-template-columns:repeat(6,1fr)}}
@media (max-height:700px){.ficha{min-height:240px}.weeknav h1{font-size:26px}.bigtxt{font-size:16.5px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}}

.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}
</style>
</head>

/* ========= STORE ========= */
const store = {
  mode:"loading", profiles:{}, tomb:{}, db:null, pending:new Set(), timers:{},
  async init(){
    let db = null;
    if (window.claude && typeof window.claude.use === "function"){ try { db = await window.claude.use("db"); } catch(e){ db = null; } }
    if (!db){ this.fallback(); return; }
    this.db = db; this.mode = "cloud";
    await new Promise(res => {
      let first = true;
      db.collection("profiles").onSnapshot(snap => {
        const next = {};
        snap.docs.forEach(d => { if (!d.exists) return; next[d.id] = (this.pending.has(d.id) && this.profiles[d.id]) ? this.profiles[d.id] : clone(d.data()); next[d.id].id = d.id; });
        this.pending.forEach(id => { if (!next[id] && this.profiles[id]) next[id] = this.profiles[id]; });
        this.profiles = next;
        if (first){ first = false; res(); } else render(false);
      }, () => { if (first){ first = false; this.fallback(); res(); } else toast("Se perdió la conexión con tus datos."); });
    });
  },
  fallback(){ this.mode = "local"; this.db = null; this.profiles = LS.get("og24.profiles", {}); this.tomb = LS.get("og24.tomb", {}); },
  persistLocal(){ LS.set("og24.profiles", this.profiles); LS.set("og24.tomb", this.tomb); },
  save(id){
    const p = this.profiles[id]; if (!p) return;
    p.u = Date.now();
    if (this.mode === "local"){ this.persistLocal(); drive.schedule(); return; }
    this.pending.add(id); clearTimeout(this.timers[id]);
    this.timers[id] = setTimeout(async () => {
      try { const body = clone(this.profiles[id]); delete body.id; await this.db.doc("profiles/"+id).set(body); }
      catch(e){
        if (e && e.code === "invalid_argument") toast("Este enlace es de solo lectura: pide acceso de colaborador.");
        else if (e && e.code === "quota_exceeded") toast("Se ha llenado el espacio de datos.");
        else toast("No se pudo guardar. Vuelve a intentarlo.");
      } finally { this.pending.delete(id); }
    }, 450);
  },
  async remove(id){
    clearTimeout(this.timers[id]); this.pending.delete(id); delete this.profiles[id];
    if (this.mode === "local"){ this.tomb[id] = Date.now(); this.persistLocal(); drive.schedule(); return; }
    try { await this.db.doc("profiles/"+id).delete(); } catch(e){ toast("No se pudo borrar el perfil."); }
  }
};

const DRIVE_FILE = "OpenGym24-sync.json";
const drive = {
  clientId: LS.get("og24.gcid", ""), token:null, exp:0, fileId: LS.get("og24.gfile", null), last: LS.get("og24.glast", null),
  state:"off", busy:false, again:false, t:0,
  enabled(){ return store.mode === "local" && !!this.clientId; },
  setState(s){ this.state = s; paintSync(); },
  loadGis(){
    return new Promise((res, rej) => {
      if (window.google && google.accounts && google.accounts.oauth2) return res();
      const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true;
      s.onload = () => res(); s.onerror = () => rej(new Error("gis")); document.head.appendChild(s);
    });
  },
  async getToken(){
    if (this.token && Date.now() < this.exp - 60000) return this.token;
    if (!this.clientId) throw new Error("noclient");
    await this.loadGis();
    return new Promise((res, rej) => {
      const tc = google.accounts.oauth2.initTokenClient({
        client_id: this.clientId, scope: "https://www.googleapis.com/auth/drive.file",
        callback: r => { if (r.error){ rej(new Error(r.error)); return; } this.token = r.access_token; this.exp = Date.now() + (r.expires_in || 3600) * 1000; LS.set("og24.gon", true); res(this.token); },
        error_callback: e => rej(new Error((e && e.type) || "popup"))

  async api(url, opts){

  async findFile(){

      const j = await (await this.api(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,modifiedTime)&orderBy=modifiedTime%20desc&pageSize=1`)).json();
      this.fileId = j.files && j.files[0] ? j.files[0].id : null;
    }
    LS.set("og24.gfile", this.fileId); return this.fileId;
  },
  async sync(interactive){
    if (!this.enabled()) return;
    if (this.busy){ this.again = true; return; }
    if (!interactive && !(this.token && Date.now() < this.exp - 60000)){ this.setState("pending"); return; }
    this.busy = true; this.setState("syncing");
    try {
      await this.getToken();
      const id = await this.findFile();
      let remote = null;
      if (id){ try { remote = await (await this.api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json(); } catch(e){ if (!/^http/.test(e.message)) throw e; remote = null; } }

      store.profiles = merged.profiles; store.tomb = merged.tomb; store.persistLocal();
      const data = JSON.stringify({app:"open-gym-24", version:2, savedAt:new Date().toISOString(), profiles: merged.profiles, tomb: merged.tomb});
      if (id){
        await this.api(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {method:"PATCH", headers:{"Content-Type":"application/json"}, body:data});
      } else {
        const b = "og24" + Date.now();
        const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:DRIVE_FILE, mimeType:"application/json"})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${data}\r\n--${b}--`;
        const j = await (await this.api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {method:"POST", headers:{"Content-Type":"multipart/related; boundary=" + b}, body})).json();
        this.fileId = j.id; LS.set("og24.gfile", this.fileId);
      }
      this.last = new Date().toISOString(); LS.set("og24.glast", this.last);
      this.setState("ok"); render(false);
      if (interactive) toast("Sincronizado con Google Drive");
    } catch(e){
      this.setState("error");
      const m = e && e.message;
      if (interactive) toast(m === "noclient" ? "Falta el Client ID de Google." : m === "gis" ? "No se pudo cargar el acceso de Google. Revisa la conexión." : m === "popup_closed" || m === "popup" ? "Cerraste la ventana de Google antes de terminar." : "No se pudo sincronizar con Drive.");

function paintSync(){

/* ===== Gráfica de líneas genérica ===== */
function lineChart(series, opts){
  opts = opts || {}; const W = 340, H = 150, pl = 30, pr = 10, pt = 12, pb = 20;
  const all = series.flatMap(s => s.pts.map(x => x.v)); if (!all.length) return `<p class="muted">Sin datos todavía.</p>`;
  let lo = Math.min(...all), hi = Math.max(...all); if (lo === hi){ lo = lo - 1; hi = hi + 1; } const padv = (hi-lo)*.12; lo -= padv; hi += padv; if (!opts.invert && lo < 0 && Math.min(...all) >= 0) lo = 0;
  const n = Math.max(...series.map(s => s.pts.length), 2), labels = opts.labels;
  const X = i => pl + (labels ? i/(labels.length-1) : i/(n-1)) * (W-pl-pr);
  const Y = v => { const k = (v-lo)/(hi-lo); return pt + (opts.invert ? k : 1-k) * (H-pt-pb); };
  let g = "";
  for (let k = 0; k <= 3; k++){ const v = lo + (hi-lo)*k/3, y = Y(v); g += `<line x1="${pl}" x2="${W-pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="0" y="${(y+3).toFixed(1)}">${opts.fmt ? opts.fmt(v) : (Math.round(v*10)/10)}</text>`; }
  if (labels) labels.forEach((l,i) => { if (l) g += `<text x="${X(i).toFixed(1)}" y="${H-4}" text-anchor="middle">${l}</text>`; });
  series.forEach(s => {
    const P = s.pts.map(x => [X(x.i), Y(x.v), x.t]);
    if (P.length > 1){ const d = P.map((q,i) => (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" "); g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw"/>`; }
    P.forEach(q => { g += `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"><title>${esc(q[2] || "")}</title></circle>`; });
  });
  const legend = series.length > 1 ? `<div class="row small" style="flex-wrap:wrap;gap:12px;margin-top:6px">${series.map(s => `<span><span style="color:${s.color}">●</span> ${esc(s.name)}</span>`).join("")}</div>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || "Gráfica")}">${g}</svg>${legend}`;
}

  }
  if (e >= T){ finishTimer(tm.mode === "ft" ? null : T); return; }
  paintTimer(); tm.raf = requestAnimationFrame(tick);
}
function setFocus(on){ const f = on && tm.focusPref; document.body.classList.toggle("focus", f); $("#focusX").hidden = !f; }
function finishTimer(sec){
  tm.acc = Math.min(tmElapsed(), tmTotal()); tm.running = false; tm.finished = true; tm.finalSec = sec;
  cancelAnimationFrame(tm.raf); releaseWake(); beep(1200, .7); say(tm.mode === "rest" ? "A por la siguiente" : "¡Tiempo!"); buzz([120,60,120]); setFocus(false);
  if (tm.mode !== "rest") confetti(180);
  if (ui.route === "reloj") render(false);
}
async function holdWake(){ try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch(e){} }
function releaseWake(){ try { wakeLock && wakeLock.release(); } catch(e){} wakeLock = null; }
function timerToggle(){
  if (tm.finished) return;
  const now = performance.now();
  if (tm.running){
    if (tm.lead > 0) tm.lead = Math.max(0, tm.lead - (now - tm.startAt)/1000); else tm.acc = tmElapsed();
    tm.running = false; cancelAnimationFrame(tm.raf); releaseWake(); setFocus(false);
  } else {
    if (!tm.acc && !tm.lead) tm.lead = tm.mode === "rest" ? 0 : 10;
    tm.running = true; tm.startAt = now; holdWake(); beep(440, .05); setFocus(true);
    tm.raf = requestAnimationFrame(tick);
  }
  render(false);
}
function timerReset(){ cancelAnimationFrame(tm.raf); Object.assign(tm, {running:false, acc:0, lead:0, laps:[], finished:false, finalSec:null, lastSeg:-1, lastBeep:"", spoke:{}, ticksOn:-1}); releaseWake(); setFocus(false); if (ui.route === "reloj") render(false); }


/* ========= ACCIONES ========= */
function go(to){ if (!ROUTES.includes(to)) to = "hoy"; const changed = ui.route !== to; ui.route = to; if (location.hash.slice(1) !== to){ try { history.replaceState(null, "", "#"+to); } catch(e){} } closeSheet(); render(changed); }
function sheetHTML(type, id){
  const p = active();
  if (type === "move") return moveDetail(id);
  if (type === "pr") return prForm();
  if (type === "prDetail") return prDetail(p, id.mov, id.unit);
  if (type === "tips"){ const s = curSession(p); return `<h1>Consejos de hoy</h1>${tips(p, s).map(([c,i,t,b]) => `<div class="note ${c}"><b>${i} ${esc(t)}</b>${esc(b)}</div>`).join("")}`; }
  if (type === "editProfile") return `<h1>Tu perfil</h1>${profileForm(p)}`;
  if (type === "addProfile") return `<h1>Nuevo atleta</h1>${profileForm()}`;
  if (type === "tmres") return `<h1>${tm.mode === "amrap" ? "¡Tiempo!" : tm.finalSec != null ? "¡Terminado!" : "Time cap"}</h1>
    <label class="field"><span>${tm.mode === "amrap" ? "Rondas + reps sueltas" : "Tiempo"}</span><input type="text" id="tmRes" value="${esc(tm.mode === "amrap" ? tm.laps.length+"+" : (tm.finalSec != null ? fmtSecFloor(tm.finalSec) : "CAP+"))}"></label>
    ${tm.origin ? `<button class="btn btn-primary btn-block" data-act="tmSave">Guardar en la sesión</button>` : `<p class="small muted">Empieza el reloj desde una sesión para guardar el resultado.</p>`}`;
  return "";
}
function openSheet(type, id){
  if (!active()) return;
  ui.sheet = {type, id}; $("#sheetBody").innerHTML = sheetHTML(type, id);
  const sh = $("#sheet"); sh.classList.add("open"); sh.setAttribute("aria-hidden","false"); $("#panel").scrollTop = 0;
  if (type === "move") figStart(id); else figStop();
}
function closeSheet(){ if (!ui.sheet) return; ui.sheet = null; figStop(); const sh = $("#sheet"); sh.classList.remove("open"); sh.setAttribute("aria-hidden","true"); }
const newId = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function commit(p){ store.save(p.id); }
function setStep(key, i, dir){
  ui.step[key] = Math.max(0, Math.min(4, i)); render(false);
  const f = $(".page"); if (f && dir) f.classList.add(dir > 0 ? "slide-n" : "slide-p");
}
let swipedAt = 0;
function swipe(kind, dir){
  swipedAt = Date.now();
  if (kind === "step"){ const s = curSession(active()); if (s) setStep(s.key, stepOf(s.key) + dir, dir); }
  if (kind === "week"){ ui.week = Math.max(1, Math.min(24, (ui.week || 1) + dir)); render(false); }
}
document.addEventListener("click", ev => { if (Date.now() - swipedAt < 350){ ev.stopPropagation(); ev.preventDefault(); } }, true);
(function(){
  let sx = null, sy = null, el = null;
  document.addEventListener("pointerdown", e => { const t = e.target.closest("[data-swipe]"); if (!t || e.target.closest("input,textarea,select,.movechips")){ el = null; return; } sx = e.clientX; sy = e.clientY; el = t; }, {passive:true});
  document.addEventListener("pointerup", e => { if (!el) return; const dx = e.clientX - sx, dy = e.clientY - sy, k = el.dataset.swipe; el = null; if (Math.abs(dx) > 55 && Math.abs(dy) < 50) swipe(k, dx < 0 ? 1 : -1); }, {passive:true});
  document.addEventListener("pointercancel", () => { el = null; });
})();
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, p = active();
  switch(act){
    case "go": go(el.dataset.to); break;
    case "sub": ui.sub[el.dataset.page] = el.dataset.sub; render(true); break;
    case "pick": ui.cur = el.dataset.id; render(false); break;
    case "step": { const s = curSession(p); const i = +el.dataset.i, cur = stepOf(s.key); setStep(s.key, i, i - cur); break; }
    case "stepGo": { const s = curSession(p); setStep(s.key, stepOf(s.key) + (+el.dataset.d), +el.dataset.d); break; }
    case "noteOpen": ui.noteOpen[el.dataset.id] = true; render(false); break;
    case "tips": openSheet("tips"); break;
    case "train": ui.cur = el.dataset.id; if (ui.step[ui.cur] == null) ui.step[ui.cur] = 0; go("hoy"); break;
    case "week": ui.week = +el.dataset.w; render(false); break;
    case "weekGo": ui.week = Math.max(1, Math.min(24, (ui.week || 1) + (+el.dataset.d))); render(false); break;
    case "openMove": ev.preventDefault(); openSheet("move", el.dataset.id); break;
    case "mtab": document.querySelectorAll('[data-act="mtab"]').forEach(b => b.setAttribute("aria-pressed", b === el)); $("#mtabBody").innerHTML = mtab(ui.sheet.id, el.dataset.k); break;
    case "closeSheet": closeSheet(); break;
    case "unfocus": document.body.classList.remove("focus"); $("#focusX").hidden = true; break;
    case "figToggle": figToggle(); $("#figIco").innerHTML = figA.paused ? ICONS.play : ICONS.pause; break;
    case "figSpeed": figSpeed(); $("#figSpd").textContent = figA.speed === 1 ? "1×" : "½×"; break;
    case "startFrom": { const s = SBY[el.dataset.id]; if (!tm.running){ timerReset(); tm.mode = s.t; tm.mins = 15; } tm.origin = s.key; go("reloj"); break; }
    case "rest": { if (!tm.running){ timerReset(); tm.mode = "rest"; tm.restSecs = +el.dataset.secs || 90; go("reloj"); timerToggle(); } else go("reloj"); break; }
    case "clearOrigin": tm.origin = null; render(false); break;
    case "tmMode": tm.mode = el.dataset.mode; if (tm.mode === "emom" && tm.mins === 15) tm.mins = 10; else if (tm.mode !== "emom" && tm.mins === 10) tm.mins = 15; timerReset(); break;
    case "tmStep": { const k = el.dataset.k, d = +el.dataset.d, lim = {mins:[1,60,1], work:[5,120,5], rest:[5,120,5], rounds:[1,30,1]}[k]; tm[k] = Math.min(lim[1], Math.max(lim[0], tm[k] + d*lim[2])); render(false); break; }
    case "tmToggle": timerToggle(); break;
    case "tmReset": timerReset(); break;
    case "stageTap": if (tm.running && tm.lead <= 0 && (tm.mode === "amrap" || tm.mode === "ft")){ tm.laps.push(tmElapsed()); const n = $("#roundN"); if (n){ n.textContent = tm.laps.length; retrigger(n, "pop"); } $("#laps").innerHTML = lapsHTML(); retrigger($("#flash"), "go"); beep(990, .06); buzz(30); } break;
    case "tmSave": { const v = ($("#tmRes") || {}).value || "", k = tm.origin; ui.drafts[k] = {result:v}; ui.cur = k; ui.step[k] = 4; closeSheet(); timerReset(); go("hoy"); toast("Revisa y guarda la sesión"); break; }
    case "optSoundBtn": tm.sound = !tm.sound; LS.set("og24.sound", tm.sound); render(false); break;
    case "share": shareSession(p, el.dataset.id); break;
    case "switch": ui.activeId = el.dataset.id; ui.cur = null; LS.set("og24.active", ui.activeId); render(false); toast("Entrena: " + store.profiles[ui.activeId].name); break;
    case "editProfile": openSheet("editProfile"); break;
    case "addProfile": openSheet("addProfile"); break;
    case "deleteProfile": { const q = store.profiles[el.dataset.id]; if (!q) break; if (!confirm(`¿Borrar el perfil de ${q.name} y todo su registro? No se puede deshacer.`)) break; await store.remove(q.id); ensureActive(); render(true); toast("Perfil borrado"); break; }
    case "newPR": openSheet("pr"); break;
    case "delPR": { const r = (p.prs || []).find(x => x.id === el.dataset.id); if (r && confirm(`¿Borrar la marca ${r.val} de ${r.mov}?`)){ r.del = true; r.u = Date.now(); commit(p); render(false); } break; }
    case "export": exportData(); break;
    case "import": $("#importFile").click(); break;
    case "syncTap": if (store.mode === "cloud") toast("Tus datos se sincronizan solos con tu cuenta de Claude"); else drive.sync(true); break;
    case "driveSync": drive.sync(true); break;
  }
});
document.addEventListener("change", ev => {
  const t = ev.target, a = t.dataset.act;
  if (a === "theme"){ LS.set("og24.theme", t.value); applyTheme(); }
  if (a === "moveGroup"){ ui.moveGroup = t.value; render(false); }
  if (a === "restPreset"){ tm.restSecs = +t.value; }
  if (a === "optSound"){ tm.sound = t.checked; LS.set("og24.sound", tm.sound); }
  if (a === "optVoice"){ tm.voice = t.checked; LS.set("og24.voice", tm.voice); if (tm.voice) say("Voz activada"); }
  if (a === "optFocus"){ tm.focusPref = t.checked; LS.set("og24.focus", tm.focusPref); }
  if (t.dataset.test){
    const p = active(), s = SBY[t.dataset.key]; if (!p || !s) return;
    p.tests = p.tests || {}; const pt = "w"+s.w; p.tests[pt] = p.tests[pt] || {};
    const v = t.value.trim(); if (v) p.tests[pt][t.dataset.test] = v; else delete p.tests[pt][t.dataset.test];
    p.tests[pt].u = Date.now(); checkBadges(p); commit(p); toast("Test guardado");
  }
});
document.addEventListener("submit", ev => {
  const f = ev.target; if (!f.dataset.form) return; ev.preventDefault();
  const fd = new FormData(f), p = active();
  if (f.dataset.form === "newProfile"){
    const name = String(fd.get("name") || "").trim(); if (!name) return;
    const id = newId();
    store.profiles[id] = {id, name, color:String(fd.get("color") || COLORS[0]), start:String(fd.get("start") || ""), createdAt:new Date().toISOString(), logs:{}, tests:{}, prs:[], badges:{}};
    commit(store.profiles[id]); ui.activeId = id; ui.cur = null; LS.set("og24.active", id); closeSheet(); ui.route = "hoy"; render(true); toast("¡A por la semana 1!"); confetti(90); return;
  }
  if (f.dataset.form === "editProfile"){
    const q = store.profiles[f.dataset.id]; if (!q) return;
    q.name = String(fd.get("name") || q.name).trim() || q.name; q.color = String(fd.get("color") || q.color); q.start = String(fd.get("start") || "");
    commit(q); closeSheet(); render(false); toast("Perfil guardado"); return;
  }
  if (f.dataset.form === "gcid"){
    drive.clientId = String(fd.get("gcid") || "").trim(); LS.set("og24.gcid", drive.clientId); drive.token = null;
    drive.setState(drive.clientId ? "pending" : "off"); render(false); toast(drive.clientId ? "Client ID guardado. Toca Sincronizar." : "Client ID borrado"); return;
  }
  if (f.dataset.form === "pr"){
    const r = {id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,5), mov:String(fd.get("mov")||"").trim().slice(0,40), val:String(fd.get("val")||"").trim().slice(0,12), unit:String(fd.get("unit")||"kg"), date:String(fd.get("date")||todayISO()), u:Date.now()};
    if (!r.mov || !r.val) return;
    p.prs = p.prs || [];
    const g = prGroups(p).find(x => x.mov.trim().toLowerCase() === r.mov.toLowerCase() && x.unit === r.unit);
    const isPR = !g || (prNum(r) != null && prNum(g.best) != null && (lowerBetter(r.unit) ? prNum(r) < prNum(g.best) : prNum(r) > prNum(g.best)));
    p.prs.push(r); checkBadges(p); commit(p); closeSheet(); render(false);
    if (isPR){ confetti(170); toast(`¡Nuevo récord en ${r.mov}!`); } else toast("Marca guardada");
    return;
  }
  if (f.dataset.form === "log"){
    const key = f.dataset.key; p.logs = p.logs || {};
    const prev = p.logs[key] || {};
    p.logs[key] = {done:true, date: prev.done && prev.date ? prev.date : todayISO(), result:String(fd.get("result")||"").trim(), rpe:+fd.get("rpe") || 7, scale:String(fd.get("scale")||"rx"), notes:fd.has("notes") ? String(fd.get("notes")||"").trim() : (prev.notes || ""), u:Date.now()};
    delete ui.drafts[key];
    const fresh = checkBadges(p); commit(p);
    ui.cur = null; const nx = nextSession(p); if (nx && ui.step[nx.key] == null) ui.step[nx.key] = 0;
    render(true); if (!fresh.length) confetti(120);
    toast(nx ? `¡Guardada! Siguiente: semana ${nx.w}, ${DAYS[nx.d].n.toLowerCase()}` : "¡Plan completado!");
  }
});
async function shareSession(p, key){
  const s = SBY[key], l = p.logs[key]; if (!l) return;
  const text = `Open Gym · Semana ${s.w}, ${DAYS[s.d].n}\n${typeLabel(s)}: ${s.m}\nResultado: ${l.result || "–"}${l.scale === "esc" ? " (escalado)" : ""} · esfuerzo ${l.rpe}/10`;
  try { if (navigator.share){ await navigator.share({text}); return; } } catch(e){ if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); toast("Resultado copiado"); } catch(e){ toast("No se pudo compartir"); }
}
$("#importFile").addEventListener("change", async ev => {
  const file = ev.target.files && ev.target.files[0]; if (!file) return;
  try {
    const data = JSON.parse(await file.text()); const profs = data && data.profiles; if (!profs || typeof profs !== "object") throw new Error("f");
    let n = 0;
    Object.values(profs).forEach(q => {
      if (!q || typeof q.name !== "string") return;
      const id = (typeof q.id === "string" && /^[A-Za-z0-9_-]{1,40}$/.test(q.id)) ? q.id : newId();
      const inc = {id, name:q.name.slice(0,24), color:/^#[0-9A-Fa-f]{6}$/.test(q.color||"") ? q.color : COLORS[0], start:typeof q.start === "string" ? q.start : "", createdAt:q.createdAt || new Date().toISOString(), logs:(q.logs && typeof q.logs === "object") ? q.logs : {}, tests:(q.tests && typeof q.tests === "object") ? q.tests : {}, prs:Array.isArray(q.prs) ? q.prs : [], badges:(q.badges && typeof q.badges === "object") ? q.badges : {}, u:q.u || 0};
      store.profiles[id] = mergeProfile(store.profiles[id], inc); store.profiles[id].id = id; store.save(id); n++;
    });
    ensureActive(); render(true); toast(n ? `Importados ${n} perfiles` : "El archivo no tenía perfiles");
  } catch(e){ toast("No se pudo leer: tiene que ser una copia exportada desde esta app."); }
  ev.target.value = "";
});
async function exportData(){
  const data = JSON.stringify({app:"open-gym-24", version:2, exportedAt:new Date().toISOString(), profiles:store.profiles}, null, 2);
  const filename = "open-gym-24-" + todayISO() + ".json";
  let dl = null;
  if (window.claude && typeof window.claude.use === "function"){ try { dl = await window.claude.use("downloads"); } catch(e){ dl = null; } }
  if (dl){ try { await dl.save({filename, data}); toast("Copia exportada"); } catch(e){ if (!e || e.code !== "declined") toast("No se pudo exportar."); } return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], {type:"application/json"})); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast("Copia exportada");
}
function applyTheme(){ const t = LS.get("og24.theme","auto"); if (t === "auto") document.documentElement.removeAttribute("data-ui"); else document.documentElement.setAttribute("data-ui", t); }


(function(){
  const grab = $("#grab"), panel = $("#panel"); let y0 = null, dy = 0;
  grab.addEventListener("pointerdown", e => { if (e.target.closest("button")) return; y0 = e.clientY; dy = 0; panel.classList.add("dragging"); grab.setPointerCapture(e.pointerId); });
  grab.addEventListener("pointermove", e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); panel.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (y0 == null) return; panel.classList.remove("dragging"); panel.style.transform = ""; if (dy > 90) closeSheet(); y0 = null; };
  grab.addEventListener("pointerup", end); grab.addEventListener("pointercancel", end);
})();
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && tm.running) holdWake(); if (!document.hidden && drive.enabled() && drive.token) drive.sync(false); });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (ROUTES.includes(h) && h !== ui.route) go(h); });
window.addEventListener("resize", () => { if (ui.route === "reloj") sizeRing(); });
(async function boot(){
  applyTheme();
  const h = location.hash.slice(1); if (ROUTES.includes(h)) ui.route = h;
  await store.init();
  if (store.mode === "local" && drive.clientId) drive.state = "pending";
  render(true);
})();
</script>
